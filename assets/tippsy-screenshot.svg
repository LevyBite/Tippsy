<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#f3f7f5"/>
      <stop offset="100%" stop-color="#e6efec"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0%" stop-color="#072016"/>
      <stop offset="100%" stop-color="#0b2a20"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" rx="20" fill="#f6fbfa"/>

  <!-- card -->
  <g transform="translate(80,80)">
    <rect width="1040" height="560" rx="28" fill="url(#g1)" stroke="#e1ece8" />
    <!-- left panel -->
    <g transform="translate(28,28)">
      <rect width="520" height="504" rx="20" fill="#ffffff" stroke="#e8f1ef"/>
      <rect x="22" y="22" width="476" height="72" rx="36" fill="#f7faf9"/>
      <!-- tip presets -->
      <g transform="translate(28,120)">
        <rect width="420" height="52" rx="26" fill="#f1f7f5"/>
        <g transform="translate(18,8)" fill="#d0e6db">
          <rect x="0" y="0" width="82" height="36" rx="18" fill="#eaf7ee" />
          <rect x="92" y="0" width="82" height="36" rx="18" fill="#eaf7ee" />
          <rect x="184" y="0" width="82" height="36" rx="18" fill="#1fb46f" />
        </g>
      </g>
      <!-- slider -->
      <rect x="36" y="220" width="460" height="14" rx="7" fill="#edf6f2"/>
      <circle cx="120" cy="227" r="12" fill="#1fb46f"/>
      <!-- people control -->
      <rect x="36" y="260" width="420" height="92" rx="46" fill="#f7faf9" stroke="#e2efea"/>
      <text x="240" y="318" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#2b2b2b">3</text>
    </g>

    <!-- right panel -->
    <g transform="translate(568,28)">
      <rect width="444" height="504" rx="20" fill="url(#g2)" stroke="#0f2f24"/>
      <text x="320" y="64" font-family="sans-serif" font-size="48" fill="#22c55e" font-weight="700">$56.05</text>
      <rect x="28" y="160" width="388" height="240" rx="18" fill="#062216" opacity="0.8"/>
      <text x="44" y="208" font-family="sans-serif" font-size="18" fill="#9ee6b9">Total tip</text>
      <text x="380" y="208" font-family="sans-serif" font-size="18" fill="#ffffff" text-anchor="end">$25.65</text>
    </g>

    <!-- caption -->
    <text x="80" y="660" font-family="sans-serif" font-size="12" fill="#7b9a92">Enter a bill, pick a tip, and split it evenly — round up and share in one tap.</text>
  </g>
</svg>
